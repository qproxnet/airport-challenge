version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: airport_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: airportchallenge
    networks:
      - airport_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airport_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/airportchallenge
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - airport_net

volumes:
  mongo_data:

networks:
  airport_net:
    driver: bridge
